name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux screenshot baselines for review
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}-${{ inputs.update_snapshots || false }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static, browser, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bunx playwright install chromium
      - run: nix develop --command bun run check:e2e-steps
      - run: nix develop --command bun run check
      - run: nix develop --command bun run check:workflow
      - name: Run browser scenarios
        shell: bash
        run: |
          if [[ "${{ inputs.update_snapshots }}" == "true" ]]; then
            nix develop --command bun run test:e2e:update-snapshots
          else
            nix develop --command bun run test:e2e
          fi
        env:
          CI: 'true'
      - name: Verify nested pull-request build
        run: nix develop --command bun run build
        env:
          PUBLIC_BASE_PATH: /xwing/pr${{ github.event.pull_request.number || 'local' }}
          VITE_GIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v6
        if: inputs.update_snapshots == true && always()
        with:
          name: linux-screenshot-baselines
          path: tests/e2e/**/screenshots/*-linux.png
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: verify
    if: >-
      inputs.update_snapshots != true &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - name: Determine deployment path
        id: deployment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=/xwing/pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "destination=pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/xwing" >> "$GITHUB_OUTPUT"
            echo "destination=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static client
        run: nix develop --command bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.deployment.outputs.base }}
          VITE_GIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out retained Pages content
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: retained-pages
      - name: Assemble a clean retained deployment
        shell: bash
        env:
          DESTINATION: ${{ steps.deployment.outputs.destination }}
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/xwing-pages-site"
          mkdir -p "$site_dir"
          cp -a retained-pages/. "$site_dir/"
          rm -rf -- "$site_dir/.git"

          if [[ -n "$DESTINATION" ]]; then
            if [[ ! "$DESTINATION" =~ ^pr[0-9]+$ ]]; then
              echo "Refusing unexpected preview destination: $DESTINATION" >&2
              exit 1
            fi
            preview_dir="$site_dir/$DESTINATION"
            rm -rf -- "$preview_dir"
            mkdir -p "$preview_dir"
            cp -a build/. "$preview_dir/"
          else
            find "$site_dir" -mindepth 1 -maxdepth 1 \
              ! -name 'pr[0-9]*' -exec rm -rf -- {} +
            cp -a build/. "$site_dir/"
          fi
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/xwing-pages-site
      - name: Link the retained pull-request preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: >-
            https://${{ github.repository_owner }}.github.io/xwing/pr${{
            github.event.pull_request.number }}/
        run: >-
          nix develop --command gh pr comment "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --edit-last
          --create-if-none
          --body "Preview: [$PREVIEW_URL]($PREVIEW_URL)"
