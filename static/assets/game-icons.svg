<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <title>Original X-Wing browser game symbol library</title>
  <defs>
    <symbol id="die-blank" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="die-focus" viewBox="0 0 24 24">
      <path d="M3 12c2.6-4 5.6-6 9-6s6.4 2 9 6c-2.6 4-5.6 6-9 6s-6.4-2-9-6Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="2.8" fill="currentColor"/>
    </symbol>
    <symbol id="die-hit" viewBox="0 0 24 24">
      <path d="m12 2 2.2 6.2L21 6l-3.8 6 4.8 4.4-7-.7L12 22l-3-6.3-7 .7L6.8 12 3 6l6.8 2.2L12 2Z" fill="currentColor"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="white" stroke-width="1.5"/>
    </symbol>
    <symbol id="die-critical" viewBox="0 0 24 24">
      <path d="m12 1 2.1 6 5.7-2.7-2.4 5.8 5.6 2.1-5.6 2.1 2.4 5.8-5.7-2.7L12 23l-2.1-5.6-5.7 2.7 2.4-5.8L1 12.2l5.6-2.1-2.4-5.8L9.9 7 12 1Z" fill="currentColor"/>
      <path d="m13 5-4 7h3l-1 7 5-9h-3V5Z" fill="white"/>
    </symbol>
    <symbol id="die-evade" viewBox="0 0 24 24">
      <path d="M12 2 20 6v5c0 5.2-3.1 9-8 11-4.9-2-8-5.8-8-11V6l8-4Z" fill="currentColor"/>
      <path d="m8 12 2.4 2.4L16.5 8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="action-focus" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
      <path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="action-evade" viewBox="0 0 24 24">
      <path d="M12 2 20 6v5c0 5.2-3.1 9-8 11-4.9-2-8-5.8-8-11V6l8-4Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="action-lock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="action-barrel-roll" viewBox="0 0 24 24">
      <path d="M7 7c2.8-2.7 7.2-2.7 10 0l2 2M17 17c-2.8 2.7-7.2 2.7-10 0l-2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="m15 9 4 .1L19 5M9 15l-4-.1L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="9" y="8" width="6" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="action-boost" viewBox="0 0 24 24">
      <path d="M12 22V6M6 12l6-7 6 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 19h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="token-shield" viewBox="0 0 24 24">
      <path d="M12 2 20 6v5c0 5.2-3.1 9-8 11-4.9-2-8-5.8-8-11V6l8-4Z" fill="currentColor"/>
    </symbol>
    <symbol id="token-force" viewBox="0 0 24 24">
      <path d="M12 2c3.5 3.2 5.2 6 5.2 8.4A5.2 5.2 0 0 1 12 15.6a5.2 5.2 0 0 1-5.2-5.2C6.8 8 8.5 5.2 12 2Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M5 20c2.1-1.8 4.4-2.7 7-2.7s4.9.9 7 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="token-charge" viewBox="0 0 24 24">
      <path d="m13.5 1-8 12h5l-1 10 9-14h-5l0-8Z" fill="currentColor"/>
    </symbol>
    <symbol id="token-stress" viewBox="0 0 24 24">
      <path d="M3 12h4l2-7 4 14 2-7h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="token-ion" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="token-disarm" viewBox="0 0 24 24">
      <path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="token-first-player" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M10 7h3v10M9 17h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="token-critical" viewBox="0 0 24 24">
      <path d="M12 2 22 20H2L12 2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 8v6M12 17v.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
